<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaanich Sport Taekwondo - الأخبار</title>
    <style>
        :root {
            --primary-color: #d90429;
            --secondary-color: #2b2d42;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h2 {
            text-align: center;
            color: var(--secondary-color);
            margin-bottom: 30px;
        }

        /* شبكة الأخبار */
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        /* بطاقة الخبر */
        .news-card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: transform 0.3s ease;
        }

        .news-card:hover {
            transform: translateY(-5px);
        }

        .delete-btn-card {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(217, 4, 4, 0.8);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8rem;
            z-index: 2;
        }

        .news-card-content-wrapper {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .news-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .news-card img:hover {
            opacity: 0.9;
        }

        .news-text-side {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .news-date-badge {
            background: #edf2f7;
            color: #4a5568;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            width: fit-content;
            margin-bottom: 8px;
        }

        .news-text-side small {
            color: var(--primary-color);
            font-weight: bold;
            font-size: 0.75rem;
            margin-bottom: 4px;
        }

        .news-text-side h3 {
            margin: 0 0 10px 0;
            font-size: 1.1rem;
            color: var(--secondary-color);
            cursor: pointer;
        }

        .news-text-side h3:hover {
            color: var(--primary-color);
        }

        .news-text-side p {
            margin: 0;
            font-size: 0.9rem;
            color: #666;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* أسفل البطاقة (زر التفاصيل والمشاركة) */
        .news-footer-row {
            padding: 12px 15px;
            background: #fff;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .read-more-btn {
            background: none;
            border: none;
            color: var(--primary-color);
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
            padding: 0;
        }

        .read-more-btn:hover {
            text-decoration: underline;
        }

        .social-share-bar {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .share-btn {
            text-decoration: none;
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 4px;
            color: white;
        }

        .share-btn.whatsapp { background-color: #25d366; }
        .share-btn.facebook { background-color: #1877f2; }

        /* نافذة العرض المنبثقة (Lightbox Modal) المتوافقة مع المعرض */
        #lightboxModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .lightbox-content {
            background: #fff;
            max-width: 700px;
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-height: 90vh;
            position: relative;
        }

        .lightbox-close {
            position: absolute;
            top: 10px;
            left: 15px;
            font-size: 1.8rem;
            color: #fff;
            background: rgba(0,0,0,0.5);
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
        }

        .lightbox-img-container {
            background: #000;
            text-align: center;
            max-height: 50vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lightbox-img-container img {
            max-width: 100%;
            max-height: 50vh;
            object-fit: contain;
        }

        .lightbox-text-container {
            padding: 20px;
            overflow-y: auto;
            text-align: right;
        }

        .lightbox-text-container h3 {
            margin-top: 0;
            color: var(--secondary-color);
        }

        .lightbox-nav-btn {
            position: absolute;
            top: 25%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.5);
            color: white;
            border: none;
            font-size: 1.5rem;
            padding: 10px 15px;
            cursor: pointer;
            z-index: 10;
            border-radius: 4px;
        }

        .lightbox-prev { right: 10px; }
        .lightbox-next { left: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>أخبار النادي</h2>
        <div id="newsGrid" class="news-grid"></div>
    </div>

    <!-- هيكل نافذة الـ Lightbox -->
    <div id="lightboxModal" onclick="closeLightbox(event)">
        <div class="lightbox-content" onclick="event.stopPropagation()">
            <span class="lightbox-close" onclick="closeLightboxDirect()">&times;</span>
            <button class="lightbox-nav-btn lightbox-prev" onclick="changeLightboxSlide(-1)">&#10095;</button>
            <button class="lightbox-nav-btn lightbox-next" onclick="changeLightboxSlide(1)">&#10094;</button>
            
            <div class="lightbox-img-container">
                <img id="lightboxImg" src="" alt="">
            </div>
            <div class="lightbox-text-container">
                <h3 id="lightboxTitle"></h3>
                <p id="lightboxDesc" style="white-space: pre-line; line-height: 1.6;"></p>
            </div>
        </div>
    </div>

    <script>
        // بيانات تجريبية للأخبار (أو استخدم الدالة المرتبطة بالتخزين المحلي لدقائك)
        const defaultNews = [
            {
                id: 1,
                title: "البطولة الوطنية للتايكوندو",
                date: "سبتمبر 2026",
                desc: "شارك أبطال النادي في منافسات البطولة الوطنية وحققوا نتائج مشرفة جداً تعكس مجهودات الإطار الفني والتدريب المستمر.",
                img: "https://via.placeholder.com/600x400?text=Taekwondo+News"
            },
            {
                id: 2,
                title: "انطلاق التحضيرات البدنية للموسم الجديد",
                date: "أغسطس 2026",
                desc: "بدأت تدريبات التحضير البدني العام والخاص للفئات السنية المختلفة استعداداً للمواعيد الرياضية القادمة.",
                img: "https://via.placeholder.com/600x400?text=Training+Camp"
            }
        ];

        let currentLightboxItems = [];
        let currentLightboxIndex = 0;

        function getStoredData(key, fallback) {
            const data = localStorage.getItem(key);
            return data ? JSON.parse(data) : fallback;
        }

        function renderNews() {
            let newsList = getStoredData('kst_news', defaultNews);
            let container = document.getElementById('newsGrid');
            container.innerHTML = '';

            newsList.forEach((n, idx) => {
                let card = document.createElement('article');
                card.className = 'news-card';
                card.innerHTML = `
                    <button class="delete-btn-card" onclick="deleteNews(event, ${n.id})">حذف</button>
                    <div class="news-card-content-wrapper">
                        ${n.img ? `<img src="${n.img}" alt="${n.title}" onclick="openLightboxList(newsList.map(item => ({ img: item.img, title: item.title, desc: (item.date ? 'التاريخ/الموسم: ' + item.date + '\\n\\n' : '') + item.desc })), ${idx})">` : ''}
                        <div class="news-text-side">
                            ${n.date ? `<span class="news-date-badge">📅 ${n.date}</span>` : ''}
                            <small>KST NEWS</small>
                            <h3 onclick="openLightboxList(newsList.map(item => ({ img: item.img, title: item.title, desc: (item.date ? 'التاريخ/الموسم: ' + item.date + '\\n\\n' : '') + item.desc })), ${idx})">${n.title}</h3>
                            <p>${n.desc}</p>
                        </div>
                    </div>
                    <div class="news-footer-row">
                        <button class="read-more-btn" onclick="openLightboxList(newsList.map(item => ({ img: item.img, title: item.title, desc: (item.date ? 'التاريخ/الموسم: ' + item.date + '\\n\\n' : '') + item.desc })), ${idx})">عرض التفاصيل ...</button>
                        <div class="social-share-bar">
                            <span style="font-size:0.8rem; font-weight:bold; color:#475569;">مشاركة:</span>
                            <a href="https://api.whatsapp.com/send?text=${encodeURIComponent(n.title + ' - ' + n.desc)}" target="_blank" class="share-btn whatsapp">واتساب</a>
                            <a href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(window.location.href)}" target="_blank" class="share-btn facebook">فيسبوك</a>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function deleteNews(event, id) {
            event.stopPropagation();
            if(confirm('هل أنت متأكد من حذف هذا الخبر؟')) {
                let newsList = getStoredData('kst_news', defaultNews);
                newsList = newsList.filter(item => item.id !== id);
                localStorage.setItem('kst_news', JSON.stringify(newsList));
                renderNews();
            }
        }

        // دوال الـ Lightbox الموحدة
        function openLightboxList(items, index) {
            currentLightboxItems = items;
            currentLightboxIndex = index;
            updateLightboxContent();
            document.getElementById('lightboxModal').style.display = 'flex';
        }

        function updateLightboxContent() {
            if (currentLightboxItems.length === 0) return;
            let item = currentLightboxItems[currentLightboxIndex];
            document.getElementById('lightboxImg').src = item.img || '';
            document.getElementById('lightboxTitle').innerText = item.title || '';
            document.getElementById('lightboxDesc').innerText = item.desc || '';
        }

        function changeLightboxSlide(direction) {
            currentLightboxIndex += direction;
            if (currentLightboxIndex >= currentLightboxItems.length) {
                currentLightboxIndex = 0;
            } else if (currentLightboxIndex < 0) {
                currentLightboxIndex = currentLightboxItems.length - 1;
            }
            updateLightboxContent();
        }

        function closeLightbox(event) {
            document.getElementById('lightboxModal').style.display = 'none';
        }

        function closeLightboxDirect() {
            document.getElementById('lightboxModal').style.display = 'none';
        }

        // تشغيل الدالة عند تحميل الصفحة
        window.onload = function() {
            renderNews();
        };
    </script>
</body>
</html>
